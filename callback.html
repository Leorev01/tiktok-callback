<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok login code</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; }
  code { display: block; padding: 14px; background: #f2f2f2; border-radius: 8px; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Login code</h1>
<p id="msg">Copy this code and paste it into auth_setup.py.</p>
<code id="code">(no code found)</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('code')) document.getElementById('code').textContent = p.get('code');
  if (p.get('error')) document.getElementById('msg').textContent = 'Login error: ' + p.get('error') + ' ' + (p.get('error_description') || '');
</script>
</body>
</html>
